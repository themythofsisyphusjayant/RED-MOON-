[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qasida"
dynamic = ["version"]
description = "Qasida — a small, safe, fast language with an ML stack"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jayant Dubey" }]

[project.urls]
Homepage = "https://github.com/themythofsisyphusjayant/RED-MOON-"
Repository = "https://github.com/themythofsisyphusjayant/RED-MOON-"

[project.optional-dependencies]
ml = ["torch", "numpy"]

[project.scripts]
# 2.1.0: the installed command dispatches hosted-first (forge_lang/launcher.py).
# It execs the bundled Linux-x86_64 hosted compiler
# (forge_lang/bin/qasida-hosted) on the proven CLI surface and falls
# back to the Python compiler everywhere else.
qasida = "forge_lang.launcher:main"

[tool.setuptools.dynamic]
version = { attr = "forge_lang.__version__" }

[tool.setuptools.packages.find]
include = ["forge_lang*"]

[tool.setuptools.package-data]
# 2.1.0: the wheel ships the prebuilt hosted compiler (Linux x86_64).
# forge_lang/bin/qasida-hosted is a byte-identical copy of the repo's
# bin/qasida-hosted — same blob, verified by md5 at release time.
forge_lang = ["stdlib/*.fg", "bin/qasida-hosted"]
